[project]
name = "goulong-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-ai>=0.0.15",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.17",
    "httpx>=0.27.0",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.6",
    "litellm>=1.83.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "cryptography>=44.0.0",
    "arq>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools]
packages = ["agents", "tools", "routers", "core", "app", "app.prompts", "models", "services", "workers"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
